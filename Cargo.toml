[workspace]
resolver = "2"
members = ["crates/vc-core", "crates/vc-bot"]

[workspace.package]
version = "4.2.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["ZirconX"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
